services:
  web:
    build:
      context: .
    depends_on:
      - db
      - redis
    env_file: .env
    image: radio-games-web
    ipc: host
    restart: unless-stopped
    command: uv run ./serve.sh
    container_name: radio-games-web
    healthcheck:
      test: curl --fail http://127.0.0.1:${PORT}/ || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 0s
    ports:
      - 127.0.0.1:${PORT}:${PORT}
    # volumes:
    #   - .:/app:delegated
    #   - ../fast-matcher/contacts.sqlite:/app/contacts.sqlite:delegated

  db:
    command: postgres -c "shared_preload_libraries=pg_stat_statements" -c "pg_stat_statements.track=all" -c "log_connections=true" -c "max_locks_per_transaction=256"
    container_name: radio-games-db
    environment:
      POSTGRES_DB: radio-games
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: pg_isready -U ${DB_USERNAME} radio-games
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 0s
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - data:/var/lib/postgresql

  redis:
    container_name: radio-games-redis
    image: redis:7.2.5

volumes:
  data:
    driver: local
