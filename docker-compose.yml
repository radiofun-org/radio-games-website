services:
  web:
    build:
      context: .
    depends_on:
      - db
      - redis
    env_file: .env
    image: radio-games-web
    ipc: host
    restart: unless-stopped
    command: ./serve.sh
    container_name: radio-games-web
    healthcheck:
      test: curl --fail http://127.0.0.1:${PORT}/ || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 0s
    ports:
      - 127.0.0.1:${PORT}:${PORT}
    volumes:
      - .:/app:delegated
      - ${UPLOADS_PATH:-./uploads}:/app/uploads

  matcher:
    build:
      context: ../fast-matcher
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/radio-games
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /uploads
    restart: unless-stopped
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/uploads

  db:
    command: postgres -c "shared_preload_libraries=pg_stat_statements" -c "pg_stat_statements.track=all" -c "log_connections=true" -c "max_locks_per_transaction=256"
    container_name: radio-games-db
    environment:
      POSTGRES_DB: radio-games
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: pg_isready -U ${DB_USERNAME} radio-games
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 0s
    image: postgres:18
    restart: unless-stopped
    volumes:
      - data:/var/lib/postgresql

  awards-worker:
    build:
      context: .
    depends_on:
      - db
      - redis
    env_file: .env
    image: radio-games-web
    restart: unless-stopped
    command: /venv/bin/python manage.py run_awards_worker
    container_name: radio-games-awards-worker

  redis:
    container_name: radio-games-redis
    image: redis:8

volumes:
  data:
    driver: local
