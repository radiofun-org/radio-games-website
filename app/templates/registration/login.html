{% extends "base.html" %}

{% block content %}
<div class="container col-xl-10 col-xxl-9 px-4 py-5">
  <div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-5">
      <form class="p-4 p-md-5 border rounded-3 bg-body-tertiary" method="post" action="{% url 'login' %}">
        {% csrf_token %}

        {% if form.errors %}
          <div class="alert alert-danger">
            <p>Your username and password didn't match. Please try again.</p>
          </div>
        {% endif %}

        <div class="form-floating mb-3">
          <input type="text" class="form-control{% if form.username.errors %} is-invalid{% endif %}" id="id_username" name="username" placeholder="Username" value="{{ form.username.value|default:'' }}" autofocus>
          <label for="id_username">Username</label>
        </div>

        <div class="form-floating mb-3">
          <input type="password" class="form-control{% if form.password.errors %} is-invalid{% endif %}" id="id_password" name="password" placeholder="Password">
          <label for="id_password">Password</label>
        </div>

        <button class="w-100 btn btn-lg btn-primary" type="submit">Log in</button>
        <input type="hidden" name="next" value="{{ next }}">

        <hr class="my-4">

        <small class="text-body-secondary"><a href="{% url 'password_reset' %}">Lost password?</a></small>
      </form>
    </div>
  </div>
</div>
{% endblock %}
