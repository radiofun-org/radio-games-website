[project]
name = "radio-games-website"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
	"dj-database-url>=3.1.2",
	"django>=6.0.2,<6.1",
	"django-anymail>=14.0",
	"django-cors-headers>=4.9.0",
	"django-extensions>=4.1",
	"django-filter>=25.2",
	"django-oauth-toolkit>=3.2.0",
	"djangorestframework>=3.16.1",
	"env-tools>=2.2.0",
	"gunicorn>=25.1.0",
	"ipython>=9.10.0",
	"psycopg[binary]>=3.3.3",
	"django-altcha>=0.4.0",
	"redis>=5.0.0",
	"whitenoise[brotli]>=6.11.0",
]

[dependency-groups]
dev = [
	"django-upgrade>=1.29.0",
	"ruff>=0.15.2",
	"mypy>=1.19.1",
	"mypy-extensions>=1.1.0",
	"typing_extensions>=4.15.0",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "UP"]
