[project]
name = "radio-games-website"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
	"dj-database-url>=3.1.2",
	"django>=6.1,<6.2",
	"django-anymail>=15.1",
	"django-cors-headers>=4.9.0",
	"django-extensions>=4.1",
	"django-ninja>=1.6.3",
	"django-oauth-toolkit>=3.4.0",
	"env-tools>=2.2.0",
	"ipython>=9.16.1",
	"psycopg[binary]>=3.3.4",
	"django-altcha>=1.0.0",
	"httpx>=0.28.0",
	"redis>=8.1.0",
	"uvicorn[standard]>=0.52.3",
	"whitenoise[brotli]>=6.12.0",
	"sentry-sdk[django]>=2.68.0",
]

[dependency-groups]
dev = [
	"django-stubs>=6.1.0",
	"django-upgrade>=1.31.1",
	"pytest>=9.1.1",
	"pytest-django>=4.14.0",
	"ruff>=0.16.4",
	"ty>=0.0.74",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
# lint and type-check tooling tracks latest; the 7-day cutoff is for
# application dependencies
ruff = "2035-01-01T00:00:00Z"
ty = "2035-01-01T00:00:00Z"
# django-ninja 1.6.3 (2026-08-17) drops its Django<6.1 pin; this exception is
# inert once it ages past the 7-day window (2026-08-24) and can be removed then
django-ninja = "2026-08-18T00:00:00Z"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.test_settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

