[project]
name = "radio-games-website"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
	"dj-database-url>=3.1.2",
	"django>=6.0.2,<6.1",
	"django-anymail>=14.0",
	"django-cors-headers>=4.9.0",
	"django-extensions>=4.1",
	"django-ninja>=1.3.0",
	"env-tools>=2.2.0",
	"ipython>=9.10.0",
	"psycopg[binary]>=3.3.3",
	"django-altcha>=0.4.0",
	"httpx>=0.28.0",
	"redis>=5.0.0",
	"uvicorn[standard]>=0.34.0",
	"whitenoise[brotli]>=6.11.0",
]

[dependency-groups]
dev = [
	"django-upgrade>=1.29.0",
	"mypy>=1.19.1",
	"mypy-extensions>=1.1.0",
	"pytest>=8.0",
	"pytest-django>=4.9",
	"ruff>=0.15.2",
	"typing_extensions>=4.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.test_settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "UP"]
