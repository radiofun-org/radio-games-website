[project]
name = "radio-games-website"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
	"django>=5.0.6",
	"django-anymail>=10.3",
	"django-cors-headers>=4.3.1",
	"django-extensions>=3.2.3",
	"django-filter>=24.2",
	"django-oauth-toolkit>=2.4.0",
	"djangorestframework>=3.15.1",
	"env-tools>=2.2.0",
	"gunicorn>=22.0.0",
	"ipython>=8.11.0",
	"psycopg2>=2.9.9",
	"whitenoise[brotli]>=6.6.0",
]

[dependency-groups]
dev = ["ruff>=0.4.5", "mypy", "mypy-extensions", "typing_extensions>=4.12.0"]

[tool.ruff]
line-length = 99
